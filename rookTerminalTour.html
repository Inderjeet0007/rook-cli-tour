<style>
/* === TOKENS === */
/* Layout: full-bleed dark terminal with step-nav sidebar on desktop, stacked on mobile */
:root {
  --bg:         #0d1117;
  --bg2:        #161b22;
  --bg3:        #21262d;
  --border:     #30363d;
  --fg:         #c9d1d9;
  --fg-muted:   #6e7681;
  --fg-dim:     #484f58;
  --amber:      #d4a843;
  --amber-dim:  #7a5f24;
  --cyan:       #58a6b8;
  --cyan-dim:   #2d5f6e;
  --green:      #3fb950;
  --red:        #f85149;
  --yellow:     #4b4944;
  --prompt:     #58a6b8;
  --cmd:        #58a6b8;
  --sub:        #6e7681;
  --question:   #d4a843;
  --answer:     #58a6b8;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.6;
}

body {
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  overflow: hidden;
}

/* ── Header ── */
.header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.rook-logo {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  color: var(--amber);
  letter-spacing: 4px;
}

.header-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--fg-muted);
}

.badge {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--amber);
}

/* ── Main layout ── */
.layout {
  flex: 1;
  display: flex;
  gap: 0;
  overflow: hidden;
  min-height: 0;
}

/* ── Step nav ── */
.step-nav {
  flex-shrink: 0;
  width: 200px;
  border-right: 1px solid var(--border);
  padding: 16px 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.step-btn {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 16px;
  cursor: pointer;
  border: none;
  background: none;
  color: var(--fg-muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-align: left;
  line-height: 1.4;
  border-left: 2px solid transparent;
  transition: color 0.15s, background 0.15s, border-color 0.15s;
  width: 100%;
}

.step-btn:hover {
  background: var(--bg2);
  color: var(--fg);
}

.step-btn.active {
  color: var(--amber);
  border-left-color: var(--amber);
  background: color-mix(in srgb, var(--amber) 8%, transparent);
}

.step-btn.done {
  color: var(--green);
  border-left-color: var(--green);
}

.step-num {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1px solid currentColor;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  font-weight: 700;
  margin-top: 1px;
}

.step-btn.done .step-num {
  background: var(--green);
  color: var(--bg);
  border-color: var(--green);
}

.step-label { flex: 1; }

/* ── Terminal pane ── */
.terminal-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.term-titlebar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}

.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot-r { background: #ff5f57; }
.dot-y { background: #febc2e; }
.dot-g { background: #28c840; }

.term-path {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--fg-muted);
  margin-left: 4px;
}

.term-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  line-height: 1.7;
  scroll-behavior: smooth;
}

/* ── Controls ── */
.controls {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg2);
}

.btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 6px 14px;
  border-radius: 4px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
  background: var(--bg3);
  color: var(--fg);
}

.btn:hover { border-color: var(--fg-muted); color: #fff; }

.btn-primary {
  background: var(--amber-dim);
  border-color: var(--amber);
  color: var(--amber);
}
.btn-primary:hover { background: var(--amber); color: var(--bg); }

.btn-sm {
  padding: 4px 10px;
  font-size: 10px;
}

.progress-track {
  flex: 1;
  height: 3px;
  background: var(--bg3);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--amber);
  border-radius: 2px;
  transition: width 0.3s ease;
}

.step-indicator {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--fg-muted);
  white-space: nowrap;
}

/* ── Terminal line types ── */
.line { display: block; }

.l-prompt { color: var(--prompt); }
.l-prompt .user { color: var(--fg-muted); }
.l-prompt .at   { color: var(--fg-dim); }
.l-prompt .dir  { color: var(--cyan); }
.l-prompt .pct  { color: var(--fg-muted); }
.l-cmd          { color: var(--cmd); }

.l-bullet       { color: var(--sub); }
.l-bullet .hi   { color: var(--fg); }
.l-bullet .amber { color: var(--amber); }
.l-bullet .cyan  { color: var(--cyan); }
.l-bullet .green { color: var(--green); }

.l-work { color: var(--fg-dim); padding-left: 2ch; }
.l-work::before { content: "├ "; color: var(--fg-dim); }

.l-question { color: var(--question); }
.l-question::before { content: "◆ "; }

.l-answer { color: var(--answer); padding-left: 2ch; }
.l-answer::before { content: "> "; }

.l-section { color: var(--fg); font-weight: 700; }
.l-sub     { color: var(--sub); padding-left: 2ch; }

.l-table-head { color: var(--fg-muted); padding-top: 4px; }
.l-table-row  { color: var(--fg); }
.l-table-row .pass  { color: var(--green); }
.l-table-row .fail  { color: var(--red); }
.l-table-row .crit  { color: var(--red); font-weight: 700; }
.l-table-row .amber { color: var(--amber); }

.l-blank { height: 0.8em; display: block; }

.l-timing {
  color: var(--fg-dim);
  font-size: 11px;
}
.l-timing::before { content: "* "; }

.l-path { color: var(--fg-muted); word-break: break-all; }

.l-result { color: var(--fg); }
.l-result .pass  { color: var(--green); font-weight: 700; }
.l-result .fail  { color: var(--red); font-weight: 700; }
.l-result .warn  { color: var(--yellow); }

.l-heading {
  color: var(--amber);
  font-size: 13px;
  font-weight: 700;
  padding-top: 6px;
  padding-bottom: 2px;
}

.l-info { color: var(--sub); }
.l-info .cmd { color: var(--cyan); }
.l-info .dim { color: var(--fg-dim); }

/* Typewriter cursor */
.cursor {
  display: inline-block;
  width: 7px;
  height: 13px;
  background: var(--amber);
  vertical-align: text-bottom;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* Fade-in for lines */
.line { opacity: 0; animation: fadein 0.12s ease forwards; }
@keyframes fadein { to { opacity:1; } }

/* ── ASCII art ── */
.ascii-art {
  color: var(--amber);
  font-size: 9px;
  line-height: 1.25;
  letter-spacing: 0px;
  white-space: pre;
  margin-bottom: 4px;
}

.tagline {
  color: var(--amber-dim);
  font-style: italic;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}

.workflow-row {
  display: flex;
  gap: 0;
  flex-wrap: wrap;
  margin: 8px 0 4px;
}
.workflow-item {
  padding-right: 20px;
  border-right: 1px solid var(--border);
  margin-right: 20px;
}
.workflow-item:last-child { border-right: none; }
.workflow-item .wf-cmd { color: var(--amber); font-size: 11px; display: flex; align-items: center; gap: 4px; }
.workflow-item .wf-desc { color: var(--sub); font-size: 10px; margin-top: 1px; }

.target-bar {
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 6px 0;
  margin: 6px 0;
  font-size: 11px;
}
.target-bar .label { color: var(--fg-muted); }
.target-bar .agent { color: var(--amber); }
.target-bar .meta  { color: var(--sub); }

/* Responsive */
@media (max-width: 640px) {
  .step-nav { display: none; }
  .term-body { font-size: 11px; padding: 12px 14px; }
}

/* scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
</style>

    </div>
  </div>

</div>

/* ── Render engine ── */
let currentStep = 0;
let animTimer = null;
let gateResolve = null; // set when paused at a gate

// Listen for Enter key globally to unpause gates
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && gateResolve) {
    e.preventDefault();
    triggerGate();
  }
});

function triggerGate() {
  if (!gateResolve) return;
  const fn = gateResolve;
  gateResolve = null;
  // remove the enter hint
  const hint = document.getElementById('enter-hint');
  if (hint) hint.remove();
  fn();
}

function buildNav() {
  const nav = document.getElementById('step-nav');
  nav.innerHTML = '';
  STEPS.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'step-btn' + (i === currentStep ? ' active' : i < currentStep ? ' done' : '');
    btn.onclick = () => goToStep(i);
    btn.innerHTML = `
      <span class="step-num">${i < currentStep ? '✓' : i + 1}</span>
      <span class="step-label">${s.label.replace('\n','<br>')}</span>`;
    nav.appendChild(btn);
  });
}

function renderLine(l) {
  const el = document.createElement('span');
  el.className = 'line';

  switch(l.t) {
    case 'blank':
      el.className = 'line l-blank'; break;

    case 'prompt':
      el.className = 'line l-prompt';
      el.innerHTML = l.text; break;

    case 'prompt-typing': {
      el.className = 'line l-prompt';
      const prefix = `<span class="user">inderjeets</span><span class="at">@</span><span class="user">Mac</span> <span class="dir">claimdesk-agent</span> <span class="pct">%</span> `;
      const cmdSpan = document.createElement('span');
      cmdSpan.style.color = 'var(--cmd)';
      el.innerHTML = prefix;
      el.appendChild(cmdSpan);
      let ci = 0;
      const chars = l.text;
      const typeNext = () => {
        if (ci < chars.length) {
          cmdSpan.textContent += chars[ci++];
          animTimer = setTimeout(typeNext, 38);
        }
      };
      animTimer = setTimeout(typeNext, 80);
      break;
    }

    case 'prompt-typing-tui': {
      el.className = 'line l-prompt';
      const tuiCmdSpan = document.createElement('span');
      tuiCmdSpan.style.color = 'var(--cmd)';
      el.innerHTML = `<span class="pct">&gt;</span> `;
      el.appendChild(tuiCmdSpan);
      let tci = 0;
      const tchars = l.text;
      const tuiTypeNext = () => {
        if (tci < tchars.length) {
          tuiCmdSpan.textContent += tchars[tci++];
          animTimer = setTimeout(tuiTypeNext, 38);

      animTimer = setTimeout(tuiTypeNext, 80);

function showEnterHint(body, cursorEl, resume) {
  const hint = document.createElement('div');
  hint.id = 'enter-hint';
  hint.style.cssText = `
    display:inline-flex;align-items:center;gap:8px;
    margin:6px 0 2px;padding:5px 12px;
    border:1px solid var(--amber-dim);border-radius:4px;
    font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--amber);background:color-mix(in srgb,var(--amber) 8%,transparent);
    cursor:pointer;animation:fadein 0.2s ease forwards;
  `;
  hint.innerHTML = `<span style="font-size:14px;">↵</span> Press <kbd style="background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:1px 5px;">Enter</kbd> to run`;
  hint.onclick = () => triggerGate();
  body.insertBefore(hint, cursorEl);
  body.scrollTop = body.scrollHeight;
  gateResolve = resume;
}

function runStep(stepIdx) {
  if (animTimer) { clearTimeout(animTimer); animTimer = null; }
  gateResolve = null;
  // remove any stale hint
  const oldHint = document.getElementById('enter-hint');
  if (oldHint) oldHint.remove();

  currentStep = stepIdx;
  buildNav();
  updateControls();

  const body = document.getElementById('term-body');
  body.innerHTML = '';

  const step = STEPS[stepIdx];
  let i = 0;

  // Add cursor placeholder
  const cursorEl = document.createElement('span');
  cursorEl.className = 'cursor';
  body.appendChild(cursorEl);

  function addLine() {
    if (i >= step.lines.length) {
      cursorEl.remove();
      return;
    }
    const l = step.lines[i++];

    // Gate: pause and wait for Enter
    if (l.t === 'gate') {
      // wait until typing animation finishes (prompt-typing uses animTimer)
      // then show the hint
      const resume = () => { animTimer = setTimeout(addLine, 100); };
      // slight delay so typing completes
      animTimer = setTimeout(() => showEnterHint(body, cursorEl, resume), 350);
      return;
    }

    const el = renderLine(l);
    body.insertBefore(el, cursorEl);
    body.scrollTop = body.scrollHeight;

    // vary delay by line type
    let delay = 60;
    if (l.t === 'blank')          delay = 30;
    if (l.t === 'ascii')          delay = 200;
    if (l.t === 'workflow')       delay = 120;
    if (l.t === 'target')         delay = 80;
    if (l.t === 'prompt')         delay = 180;
    if (l.t === 'prompt-typing')      delay = l.text.length * 38 + 150;
    if (l.t === 'prompt-typing-tui') delay = l.text.length * 38 + 150;
    if (l.t === 'question')       delay = 250;
    if (l.t === 'answer')         delay = 300;
    if (l.t === 'work')           delay = 120;
    if (l.t === 'timing')         delay = 50;
    if (l.t === 'result')         delay = 100;
    if (l.t === 'table-row')      delay = 80;
    if (l.t === 'install-intro')  delay = 200;

    animTimer = setTimeout(addLine, delay);
  }

  // Small boot delay
  animTimer = setTimeout(addLine, 300);
}

function goToStep(idx) {
  runStep(idx);
}

function nextStep() {
  if (currentStep < STEPS.length - 1) runStep(currentStep + 1);
}

function prevStep() {
  if (currentStep > 0) runStep(currentStep - 1);
}

function restartStep() {
  runStep(currentStep);
}

function updateControls() {
  const total = STEPS.length;
  document.getElementById('btn-prev').disabled = currentStep === 0;
  document.getElementById('btn-next').disabled = currentStep === total - 1;
  document.getElementById('btn-next').textContent = currentStep === total - 1 ? 'Done ✓' : 'Next ▶';
  document.getElementById('step-indicator').textContent = `${currentStep + 1} / ${total}`;
  document.getElementById('phase-label').textContent = `Step ${currentStep + 1} of ${total}`;
  document.getElementById('progress-fill').style.width = `${((currentStep + 1) / total) * 100}%`;
}

// Boot
runStep(0);
</script>

</body></html>
